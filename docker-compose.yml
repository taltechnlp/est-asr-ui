services:
  postgres:
    image: postgres:18
    restart: always
    ports:
      - "4123:5432"
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    volumes:
      # 18+ keeps its data in a per-major subdirectory (/var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
